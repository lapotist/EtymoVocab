<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EtymoVocab</title>
  <meta name="description" content="從同義詞與反義詞發現單字，再用互動詞源地圖探索演變路徑與同根詞家族。資料即時取自 Wiktionary。">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="engine.js">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/">EtymoVocab <span class="brand-caption">單字探索</span></a>
      <nav class="site-nav" aria-label="主要功能">
        <a href="#/" data-section="explore">探索單字</a>
        <a href="#/bulk" data-section="bulk">批次查詢</a>
        <a href="#/saved" data-section="saved">收藏 <span id="saved-count">0</span></a>
        <a href="#/learn" data-section="learn">推論練習</a>
      </nav>
      <form id="search" role="search" autocomplete="off">
        <input id="q" name="q" type="search" list="suggestions" placeholder="查同義詞與反義詞，例如 nice"
               autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="英文單字">
        <datalist id="suggestions"></datalist>
        <button type="submit">查詢</button>
      </form>
    </div>
  </header>

  <main id="view" aria-live="polite">
    <p class="muted">正在載入 EtymoVocab…</p>
  </main>

  <footer class="foot">
    單字探索的詞源、釋義與翻譯由你的瀏覽器即時查詢 <a href="https://en.wiktionary.org/" rel="noopener">Wiktionary</a>，
    內容採 <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">CC BY-SA 4.0</a> 授權；
    每筆查詢結果都附上引用的修訂版連結。推論練習使用專案編寫的例句與說明，並附詞條來源。
    <a href="https://github.com/lapotist/EtymoVocab" rel="noopener">原始碼</a>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
